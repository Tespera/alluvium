# Recipe: verbose
#
# Style: full pedagogical write-up. Code snippets allowed. Each fact is a
# complete explanation a future reader could understand without prior context.
# Best for research, knowledge-base building, content production.

[meta]
name = "verbose"
description = "Full pedagogical write-up; long-form concept and entity pages."
inherits = "default"

[overrides]
max_facts_per_session = 20
max_body_chars = 4000

[prompt_overrides]
extra_system = """

RECIPE OVERRIDE — verbose:
- Style: pedagogical write-up. Each fact is a complete explanation a future reader could grasp without prior context.
- **Code snippets ARE permitted** (use markdown ```language fences). Quote relevant code from the transcript when it illustrates a concept.
- Each `body_markdown` is 3-6 paragraphs with background, "why", and concrete examples.
- Up to 20 facts. Comprehensive coverage.
"""
