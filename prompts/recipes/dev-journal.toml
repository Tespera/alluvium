# Recipe: dev-journal (the default for most users)
#
# Style: first-person past-tense narrative, decisions + gotchas heavy.
# Closest match to "what did I learn today" working journal vibe.

[meta]
name = "dev-journal"
description = "First-person dev journal: decisions + gotchas heavy."
inherits = "default"

[overrides]
max_facts_per_session = 12
max_body_chars = 1200

[prompt_overrides]
extra_system = """

RECIPE OVERRIDE — dev-journal:
- Style: first-person past tense ("we tried X, hit Y, ended up Z"). Narrative tone.
- Prioritize `decision` and `gotcha` facts over abstract concepts.
- For decisions: include the alternatives considered and why they were rejected.
- For gotchas: include the surprising bit and the path to figuring it out.
- Each `body_markdown` is 2-4 paragraphs (~1200 characters max).
- Aim for ≤12 total facts.
"""
