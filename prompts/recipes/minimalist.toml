# Recipe: minimalist
#
# Style: only the most condensed signal. Decisions and key conclusions, no
# exposition. Best for users who want a lean vault and don't mind losing
# narrative detail.

[meta]
name = "minimalist"
description = "Only the most condensed signal: decisions and conclusions."
inherits = "default"

[overrides]
max_facts_per_session = 5
max_body_chars = 400

[prompt_overrides]
extra_system = """

RECIPE OVERRIDE — minimalist:
- Style: terse, declarative, conclusions only. No exposition.
- Each `body_markdown` at most 1-2 short paragraphs (~400 characters).
- Drop background, tradeoffs, and examples — that is the verbose recipe's job.
- Skip `gotcha` and `decision` types unless they are critical to remember.
- Aim for ≤5 total facts. Quality over quantity.
"""
