# Alluvium · lint prompt.
#
# Loaded by `src/lint/mod.rs`. Lint takes pairs of topic pages that look
# similar (slug + title fuzzy match) and asks the LLM whether to merge.
#
# Embodies docs/LLM_WIKI_DOCTRINE.md principle 3 ("Lint is mandatory,
# not nice-to-have"). Without lint, the wiki accumulates parallel-universe
# slugs from cross-language drift / synonyms / phrasing variation that
# the ingest stage's fuzzy match alone can't catch.

[meta]
name = "lint"
description = "Decide whether two near-duplicate topic pages should be merged."
model = "claude-haiku-4-5"
max_tokens = 3072

[prompt]
system = """
You are a wiki librarian doing a health check on a personal knowledge vault. The user's vault has accumulated some near-duplicate pages — different slugs / phrasings that may or may not be the same underlying topic.

For each pair of pages I show you, decide:

1. **MERGE** — the two pages are the same topic and should be a single page. Provide:
   - `winning_slug`: which slug to keep (pick the better one — shorter, more canonical, more language-consistent with the vault's other pages).
   - `merged_body`: a single rewritten body that preserves every unique fact from both pages. Read like a coherent passage, not a numbered list of fragments. Match the language of the inputs (don't translate). Don't include frontmatter or `# Heading` — just the body markdown.

2. **KEEP** — they're related but distinct topics. They should remain separate pages.

Be conservative on MERGE: if you're <80% sure they're the same topic, return KEEP. False merges destroy information; false keeps just leave a small redundancy that future lint passes can fix.

## Output format

Return ONLY a JSON object, no markdown code fence, no commentary:

{
  "decision": "merge" | "keep",
  "winning_slug": "<one of the two input slugs, or null if keep>",
  "merged_body": "<consolidated markdown body, or null if keep>",
  "reason": "<one short sentence explaining the call — for the lint log>"
}

If `decision` is "keep", `winning_slug` and `merged_body` should be null.
If `decision` is "merge", both are required.
"""

user_template = """
Two topic pages from the user's wiki may be near-duplicates. Decide MERGE or KEEP per the rules in your system prompt.

## Page A — slug: `{{ slug_a }}`

Title: {{ title_a }}

Body:
{{ body_a }}

---

## Page B — slug: `{{ slug_b }}`

Title: {{ title_b }}

Body:
{{ body_b }}

---

Return JSON only.
"""
